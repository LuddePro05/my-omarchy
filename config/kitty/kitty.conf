# ==============================================================================
# Kitty Terminal Configuration
# ==============================================================================

# Dynamic Omarchy Theme (Catppuccin Mocha colors + 0.65 background opacity)
include ~/.local/state/omarchy/current/theme/kitty.conf

# --- Typography & Ligatures ---------------------------------------------------
# JetBrainsMono Nerd Font provides full coding ligatures (->, !=, ==, <=, =>, etc.)
# and extensive Nerd Font icons.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        8.5

# Enable ligatures everywhere (never disable)
disable_ligatures never

# --- Window Layout & Padding --------------------------------------------------
# Matches Alacritty 14px padding and borderless frameless style
window_padding_width    14
hide_window_decorations yes
confirm_os_window_close 0

# --- Cursor & Smooth Animated Trail -------------------------------------------
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
shell_integration no-cursor

# Cursor Trail:
# Spawns a smooth fading trail when the cursor makes jumps or moves across lines
cursor_trail 3
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 2
cursor_trail_color none

# --- Graphics & Graphs (Kitty Graphics Protocol) ------------------------------
# Built-in Kitty Graphics Protocol (KGP) allows truecolor inline images,
# high-resolution graphs in btop, yazi, neovim, fastfetch, and icat.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# --- Audio & Bell -------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0

# --- Scrollback & Mouse -------------------------------------------------------
scrollback_lines 10000
mouse_hide_wait 3.0
detect_urls yes
url_color #89b4fa
url_style curly
open_url_with default
copy_on_select no

# --- Keybindings --------------------------------------------------------------
# Fullscreen & Clipboard
map F11 toggle_fullscreen
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# CSI-u sequences for TUIs (Neovim, tmux, etc.)
# Send Shift+Enter as CSI-u so TUIs distinguish it from Enter without treating it as Alt+Enter
map shift+enter send_text all \e[13;2u
# Send Alt+Shift+Enter as CSI-u for tmux/terminal apps
map alt+shift+enter send_text all \e[13;4u

# Font size adjustments
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# --- Tab Bar Aesthetics -------------------------------------------------------
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"
active_tab_font_style   bold
inactive_tab_font_style normal


