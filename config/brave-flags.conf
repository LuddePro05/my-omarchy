--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-features=TouchpadOverscrollHistoryNavigation,OverlayScrollbar
--load-extension=~/.local/share/omarchy/default/chromium/extensions/copy-url,/home/ludde/.local/share/omarchy/default/chromium/extensions/yt-dlp,/home/ludde/.local/share/omarchy/default/chromium/extensions/whatsapp-slim
