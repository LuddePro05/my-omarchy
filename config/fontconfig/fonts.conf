<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Force Noto Color Emoji for any emoji language/character -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>und-zsye</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Append Noto Color Emoji to JetBrainsMono Nerd Font, Adwaita Mono and monospace directly -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Adwaita Mono</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>


  <!-- Demote Font Awesome Free below Noto Color Emoji -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Font Awesome 7 Free</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Adwaita Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
